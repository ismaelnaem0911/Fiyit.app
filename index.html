<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fiyit - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="top-glow"></div>

    <header>
        <i class="ph ph-gear"></i>
        <div class="logo">Fiyit</div>
        <i class="ph ph-user-circle"></i>
    </header>

    <div class="welcome-text">Welcome, User! 👋</div>

    <div class="dashboard-grid">
        <a href="pages/books.html" class="card books">
            <div class="card-content"><i class="ph ph-book-bookmark"></i><span>Books</span></div>
        </a>
        <a href="pages/quiz.html" class="card quiz">
            <div class="card-content"><i class="ph ph-list-checks"></i><span>Quiz</span></div>
        </a>
        <a href="pages/progress.html" class="card progress">
            <div class="card-content"><i class="ph ph-trend-up"></i><span>Progress</span></div>
        </a>
        <a href="pages/plan.html" class="card plan">
            <div class="card-content"><i class="ph ph-calendar-blank"></i><span>Plan</span></div>
        </a>
    </div>

    <div class="bottom-wave"></div>

    <div class="chat-wrapper">
        <div class="chat-bar">
            <i class="ph ph-microphone"></i>
            <input type="text" id="ai-chat" placeholder="Type message...">
            <i class="ph ph-paper-plane-right send-btn" id="send-chat-btn"></i>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
